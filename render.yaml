services:
  - type: web
    name: tidong-digital-card
    env: php
    plan: free
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    staticPublishPath: public
    routes:
      - type: rewrite
        source: /*
        destination: /index.php
    envVars:
      - key: APP_PHP_VERSION
        value: 8.2