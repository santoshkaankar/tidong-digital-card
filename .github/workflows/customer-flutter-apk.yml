name: TIDONG Customer Flutter APK
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap Android project
        working-directory: apps/tidong_customer
        run: |
          flutter create --platforms android --project-name tidong_customer --org com.tidong .
          python3 scripts/configure_android.py
          grep -q 'runApp(const TidongApp())' lib/main.dart
          if grep -q 'Flutter Demo Home Page' lib/main.dart; then echo 'ERROR: Flutter demo detected'; exit 1; fi
      - name: Resolve dependencies
        working-directory: apps/tidong_customer
        run: flutter pub get
      - name: Analyze
        working-directory: apps/tidong_customer
        run: flutter analyze --no-fatal-infos
      - name: Test
        working-directory: apps/tidong_customer
        run: flutter test
      - name: Build APK
        working-directory: apps/tidong_customer
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tidong-customer-debug-apk
          path: apps/tidong_customer/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
